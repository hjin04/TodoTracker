name: 안드로이드 앱 빌드

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 서명 키 준비
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/todo.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/todo.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::서명 키 시크릿이 없어 임시 키로 서명합니다. 업데이트 시 앱을 지우고 다시 설치해야 할 수 있어요."
          fi

      - name: APK 빌드
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          REPO="${GITHUB_REPOSITORY#*/}"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PappUrl="https://${OWNER}.github.io/${REPO}/" \
            -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk ../my-todo.apk

      - name: 릴리스에 올리기 (고정 다운로드 주소)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest my-todo.apk \
            --title "나의 할일 안드로이드 앱 (빌드 ${{ github.run_number }})" \
            --notes "휴대폰에서 my-todo.apk 를 눌러 내려받아 설치하세요."
