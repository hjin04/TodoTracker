<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TodoTracker</title>
<meta name="theme-color" content="#FFFFFF" id="themeMeta">
<script>
  /* 화면 테마를 그리기 전에 적용 (깜빡임 방지) */
  try { var th = localStorage.getItem('todo.theme'); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; } catch (e) {}
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#FFFFFF; --card:#F5F5F5; --text:#111111; --sub:#8A8A8A; --line:#E7E7E7; --soft:#EDEDED; --sheet:#FFFFFF;
  --accent:#3D6BF2; --danger:#E5484D; --ok:#22B07D; --warn:#F59E0B; color-scheme:light;
  --chip-base:#F0F0F0; --chip-tint:0%;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#000000; --card:#121212; --text:#F2F2F2; --sub:#8C8C8C; --line:#262626; --soft:#2A2A2A; --sheet:#161616; --accent:#6E8EFF; color-scheme:dark; --chip-base:#1E1E1E; --chip-tint:0%; }
}
:root[data-theme="dark"]{ --bg:#000000; --card:#121212; --text:#F2F2F2; --sub:#8C8C8C; --line:#262626; --soft:#2A2A2A; --sheet:#161616; --accent:#6E8EFF; color-scheme:dark; --chip-base:#1E1E1E; --chip-tint:0%; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px;line-height:1.4}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.3;cursor:default}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

#app{max-width:1100px;margin:0 auto;padding:10px 16px 90px}
header{display:flex;align-items:center;gap:2px;padding:4px 0 10px;white-space:nowrap}
.ym{font-size:18px;font-weight:800;display:flex;align-items:center;gap:5px;padding:4px 4px;border-radius:10px;white-space:nowrap;min-width:0}
.ym small{font-size:11px;color:var(--sub);font-weight:600}
.sync{width:8px;height:8px;border-radius:50%;background:var(--ok);margin-left:2px}
.sync.saving{background:var(--warn);animation:pulse 1s infinite}
.sync.error{background:var(--danger)}
@keyframes pulse{50%{opacity:.3}}
.sp{flex:1}
.icon-btn{min-width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;padding:0 6px}
.icon-btn:hover{background:var(--soft)}
.icon-btn.txt{font-size:13px;font-weight:700;padding:0 10px;background:var(--soft);white-space:nowrap}
@media (max-width:360px){ .ym{font-size:16px} .icon-btn{min-width:32px} }
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.layout{display:grid;gap:14px}
@media(min-width:900px){.layout{grid-template-columns:400px 1fr;align-items:start;gap:24px}.calbox{position:sticky;top:12px}}
.calbox{background:var(--card);border-radius:18px;padding:8px 6px 6px}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.wk span{font-size:12px;color:var(--sub);padding:4px 0 2px}
.wk .sun{color:var(--danger)} .wk .sat{color:var(--accent)}
.cell{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0 6px;border-radius:12px}
.cell .b{position:relative;width:28px;height:28px;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--sub)}
.cell .b i{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--q,var(--soft))}
.cell .b i:nth-child(1){left:0;top:0} .cell .b i:nth-child(2){right:0;top:0} .cell .b i:nth-child(3){left:0;bottom:0} .cell .b i:nth-child(4){right:0;bottom:0}
.cell .b i.f{opacity:.88}
.cell .b.g{border-radius:10px;background:var(--soft)}
.cell .b span{position:relative;z-index:1;line-height:1}
.cell .b.colored span{color:#fff;text-shadow:0 0 3px rgba(0,0,0,.35)}
.cell .b svg{position:relative;z-index:1;width:15px;height:15px;stroke:#fff;fill:none;stroke-width:3;filter:drop-shadow(0 0 1px rgba(0,0,0,.35))}
.cell .n{font-size:12px;min-width:22px;height:18px;line-height:18px;border-radius:9px;padding:0 4px}
.cell.out{opacity:.35}
.cell.today .n{background:var(--text);color:var(--card);font-weight:800}
.cell.sel{background:color-mix(in srgb,var(--accent) 13%,transparent)}

.dayhead{display:flex;align-items:baseline;gap:4px 8px;margin:4px 4px 12px;flex-wrap:wrap}
.dayhead .dt,.dayhead .pr,.dayhead .carry{white-space:nowrap}
.dayhead .dt{font-size:18px;font-weight:800}
.dayhead .pr{color:var(--sub);font-size:13px;font-weight:600}
.dayhead .carry{margin-left:auto;align-self:center}
.mv-list{max-height:40vh;overflow:auto;margin:4px 0 8px}
.mv-row{display:flex;align-items:center;gap:10px;padding:8px 2px;width:100%;text-align:left}
.mv-row .chk{--c:var(--accent)}
.mv-row .s{font-size:12px;color:var(--sub);margin-left:auto}
.mv-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.mv-date{display:flex;gap:8px;margin-top:8px}
.mv-date input{flex:1;min-width:0;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.cat{margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
  background:color-mix(in srgb,var(--c) var(--chip-tint),var(--chip-base));color:var(--c);font-weight:800;font-size:14px}
.chip b{font-size:17px;line-height:1;font-weight:700}
.chip .cal{font-size:12px}
.task{display:flex;align-items:flex-start;gap:10px;padding:8px 6px;border-radius:10px}
.task:hover{background:color-mix(in srgb,var(--soft) 60%,transparent)}
[data-dnd]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.dnd-ghost{position:fixed;z-index:80;pointer-events:none;background:var(--sheet);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:.96;transform:scale(1.02)}
.dnd-src{opacity:.25}
body.dnd-on .items:empty{min-height:30px}
body.dnd-on{cursor:grabbing}
.rt-cat{margin:16px 0 6px}
.rt-head{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:999px;padding:10px 10px 10px 18px}
.rt-head b{font-size:15px}
.rt-head .plus{width:32px;height:32px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:20px;font-weight:700}
.rt-list{margin:4px 6px 0;min-height:4px}
.rt-row{display:flex;align-items:center;gap:8px;padding:12px 6px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--bg)}
.rt-row:last-child{border-bottom:0}
.rt-row .m{flex:1;min-width:0}
.rt-row .t{font-weight:700;word-break:break-word}
.rt-row .st{font-weight:800;margin-right:4px}
.rt-row .bar{color:var(--sub);margin-right:4px}
.rt-row .d{font-size:13px;color:var(--sub);margin-top:3px}
.rt-row .go{color:var(--sub);font-size:18px}
.rt-empty{color:var(--sub);font-size:13px;padding:8px 6px}
.sec-h{display:flex;align-items:center;gap:8px;margin:26px 4px 6px;color:var(--sub);font-weight:800;font-size:14px}
.archived .rt-head,.archived .rt-row{opacity:.6}
.tip{font-size:13px;color:var(--sub);margin:2px 4px 6px;line-height:1.5}
.chk{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid color-mix(in srgb,var(--c) 75%,transparent);
  margin-top:0;display:grid;place-items:center}
.chk.on{background:var(--c);border-color:var(--c)}
.chk svg{width:14px;height:14px;stroke:var(--ck,#fff);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.task .body{flex:1;min-width:0;cursor:pointer}
.task .title{word-break:break-word}
.task.done .title{color:var(--sub);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:2px;font-size:12px;color:var(--sub)}
.dday{padding:0 6px;border-radius:6px;background:var(--soft);font-weight:800}
.dday.urgent{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.sugg{opacity:.6;cursor:pointer}
.sugg:active{opacity:.9}
.sugg .rt{flex:none;width:22px;height:22px;border-radius:7px;border:2px dashed color-mix(in srgb,var(--c) 70%,transparent);
  display:grid;place-items:center;font-size:12px;color:var(--c)}
#fab{position:fixed;right:max(18px,calc(50vw - 532px));bottom:calc(22px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;
  background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:30}
#fab svg{width:26px;height:26px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round}
.qa-in{width:100%;min-height:96px;font-size:16px;margin-top:4px}
.qa-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.qa-row:last-child{border-bottom:0}
.qa-row select{flex:none;max-width:120px;background:var(--chip-base);color:var(--c);font-weight:800;border:0;border-radius:999px;padding:6px 10px;font-size:13px}
.qa-main{flex:1;min-width:0}
.qa-title{font-weight:700;word-break:break-word}
.qa-meta{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:3px}
.qa-meta span{font-size:12px;background:var(--soft);border-radius:6px;padding:1px 6px;color:var(--sub)}
.qa-ex{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.6}
.mini{font-size:12px;padding:4px 10px;border-radius:8px;background:var(--soft);font-weight:700;flex:none}
.adding form{flex:1;display:flex}
.adding input{flex:1;min-width:0;border:0;border-bottom:1.5px solid var(--c);background:transparent;padding:1px 0 4px;outline:none}
.empty{color:var(--sub);text-align:center;padding:40px 10px}

/* bottom sheet */
.overlay{position:fixed;inset:0;z-index:50}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.38)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--sheet);
  border-radius:22px 22px 0 0;padding:14px 18px calc(22px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;animation:up .18s ease-out}
@media(min-width:700px){.sheet{bottom:auto;top:6vh;border-radius:22px;max-height:88vh}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
#dialog .sheet{top:auto;bottom:auto;top:50%;left:16px;right:16px;max-width:380px;border-radius:20px;transform:translateY(-50%);animation:none}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sh-h b{font-size:16px}
.big{width:100%;font-size:18px;font-weight:700;border:0;border-bottom:2px solid var(--line);padding:8px 2px;background:transparent;outline:none;margin-bottom:6px}
.big:focus{border-color:var(--accent)}
.lbl{font-size:13px;color:var(--sub);font-weight:700;margin:14px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:14px}
.opt.on{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent));font-weight:800}
.field{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.field>label{width:62px;flex:none;color:var(--sub);font-size:14px;font-weight:600}
.field input:not(.sw),.field select{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:7px 9px;min-width:0}
.field input[type=number]{width:72px}
.field input[type=time]{width:112px;padding:7px 6px}
.field.nw{flex-wrap:nowrap}.field.nw input{flex:1 1 0;width:auto}.field.nw .x{flex:none}
.field .grow{flex:1}
.x{width:28px;height:28px;border-radius:8px;color:var(--sub)}
.hint{font-size:12px;color:var(--sub);flex-basis:100%;padding-left:70px}
textarea{width:100%;min-height:70px;margin-top:12px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;resize:vertical;outline:none}
.note{font-size:13px;color:var(--sub);margin-top:10px}
.acts{display:flex;gap:8px;margin-top:16px}
.btn{padding:10px 14px;border-radius:12px;background:var(--soft);font-weight:700}
.btn.pri{background:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%;margin-top:10px;padding:13px}
.acts .btn{flex:1}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:.2s;flex:none;cursor:pointer;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw:checked{background:var(--accent)} .sw:checked::after{left:21px}
.swatches{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;max-height:300px;overflow:auto;padding:6px 4px}
.swc{width:100%;aspect-ratio:1;border-radius:50%;background:var(--c)}
.swc.on{box-shadow:0 0 0 3px var(--sheet),0 0 0 5px var(--c)}
.custom-color{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:var(--sub)}
.custom-color input{width:44px;height:32px;border:0;padding:0;background:none}
.preview-chip{margin-left:auto}

/* settings page */
.page{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:40}
.pg{max-width:640px;margin:0 auto;padding:10px 16px 60px}
.pg-h{display:flex;align-items:center;gap:8px;padding:4px 0 12px;font-size:18px}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;padding:8px;border-radius:9px;font-weight:700;color:var(--sub)}
.tabs button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.list{background:var(--card);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 14px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.li-main{flex:1;text-align:left;display:flex;flex-direction:column;min-width:0;padding:4px 0}
.li-main .s{font-size:12px;color:var(--sub)}
.tag{font-size:11px;color:var(--warn);font-weight:700}
.info{background:var(--card);border-radius:16px;padding:6px 18px;font-size:14px}
.info h4{margin:14px 0 4px}
.info p{margin:4px 0 10px;color:var(--sub)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:.95}
#toast.act{pointer-events:auto;display:flex;align-items:center;gap:14px}
#toast.act button{color:#8FB0FF;font-weight:800;padding:2px 4px}
#connect .pg{max-width:440px;padding-top:8vh}
.cn-logo{width:72px;height:72px;border-radius:18px;display:block;margin:0 auto 14px}
#connect h2{text-align:center;margin:0 0 6px}
#connect .lead{text-align:center;color:var(--sub);font-size:14px;margin:0 0 22px}
.cn-f{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:14px 0 6px}
.cn-in{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}
.cn-in:focus{border-color:var(--accent)}
#cn_msg{margin-top:12px;font-size:14px;color:var(--danger);text-align:center;min-height:20px}
.codebox{width:100%;font-family:ui-monospace,monospace;font-size:12px;min-height:64px;margin-top:8px}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="ym" id="ymBtn" title="주/월 보기 전환"><span id="ymText"></span><small id="modeText"></small></button>
    <span class="sync" id="sync" title="동기화 상태"></span>
    <span class="sp"></span>
    <button class="icon-btn" id="prevBtn" aria-label="이전"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="icon-btn txt" id="todayBtn">오늘</button>
    <button class="icon-btn" id="nextBtn" aria-label="다음"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    <button class="icon-btn" id="setBtn" aria-label="설정"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <div class="layout">
    <section class="calbox" id="cal"></section>
    <section id="day"></section>
  </div>
</div>
<button id="fab" aria-label="빠르게 추가"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="settings" class="page hidden"></div>
<div id="overlay" class="overlay hidden"><div class="backdrop" data-close></div><div class="sheet" id="sheet"></div></div>
<div id="dialog" class="overlay hidden"><div class="backdrop"></div><div class="sheet" id="dlg"></div></div>
<div id="toast"></div>
<div id="connect" class="page hidden"><div class="pg">
  <img class="cn-logo" src="icons/icon-192.png" alt="">
  <h2>TodoTracker 연결</h2>
  <p class="lead">내 구글 Apps Script 서버와 연결해요. 처음 한 번만 하면 돼요.</p>
  <label class="cn-f" for="cn_url">서버 주소 <span style="font-weight:500">(또는 기기 연결 코드)</span></label>
  <input class="cn-in" id="cn_url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" spellcheck="false">
  <label class="cn-f" for="cn_token">연결 코드</label>
  <input class="cn-in" id="cn_token" placeholder="setup 실행 로그의 🔑 연결 코드" autocomplete="off" spellcheck="false">
  <button class="btn pri wide" id="cn_go" style="margin-top:20px">연결하기</button>
  <div id="cn_msg"></div>
  <p class="lead" style="margin-top:18px;font-size:13px">다른 기기에서 이미 쓰고 있다면 그 기기의 ⚙ 설정 → 기타 → <b>기기 연결 코드 복사</b>로 받은 코드를 첫 칸에만 붙여넣으세요.</p>
</div></div>

<script>
/* ───────── 유틸 ───────── */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD = ['일','월','화','수','목','금','토'];
/* 색상표: 색상 14가지 × 톤 5단계(파스텔→진한색) + 무채색·브라운 */
const PALETTE = (() => {
  const hsl = (h, s, l) => { s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)))).toString(16).padStart(2, '0');
    return ('#' + f(0) + f(8) + f(4)).toUpperCase(); };
  const tones = [[75, 84], [72, 72], [78, 60], [62, 47], [55, 33]];

})();
const DEFAULT_COLORS = ['#4C7CF3','#F25F5C','#8B5CF6','#22B07D','#F59E0B','#8E8E93','#EC4899','#14B8A6'];
const ALARMS = [['','없음'],['0','정시'],['5','5분 전'],['10','10분 전'],['30','30분 전'],['60','1시간 전'],['180','3시간 전'],['1440','하루 전']];
const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const pad = n => (n < 10 ? '0' : '') + n;

const hasVal = v => v !== null && v !== undefined && v !== '';

/* 카테고리 색은 사용자가 고른 색 그대로 사용 */
function isDarkMode(){ const t = S.look.theme; return t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches); }
function ink(hex){ return hex; }
/* 체크 표시(✓)만 배경색이 밝으면 검정, 어두우면 흰색으로 */

function toast(msg, action){

    t.classList.add('act'); $('#toastAct').onclick = () => { t.classList.remove('show', 'act'); action.fn(); };

const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },

};

/* ───────── 상태 ───────── */
const S = { prefs:{ autoCarry:false }, cats:{}, routines:{}, tasks:{}, today: localToday(), sel:null, ym:null, adding:null, week: store.get('weekMode') === '1', settings:null, syncErr:false };
S.sel = S.today; S.ym = S.today.slice(0, 7);
S.look = { theme: store.get('todo.theme') || 'system', badge: store.get('todo.badge') || 'clover' };
function applyTheme(){
  const t = S.look.theme;
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  $('#themeMeta').setAttribute('content', dark ? '#000000' : '#FFFFFF');
  if (window.TodoAndroid && window.TodoAndroid.setTheme) try { window.TodoAndroid.setTheme(dark); } catch (e) {}

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
const byId = arr => Object.fromEntries((arr || []).map(o => [o.id, o]));
/* 보관(archived)한 카테고리는 메인 화면·빠른 추가 등에서 숨김 */
const allCats = () => Object.values(S.cats).filter(c => !c.deleted).sort((a,b) => (a.order ?? 0) - (b.order ?? 0));
const sortedCats = () => allCats().filter(c => !c.archived);
const archivedCats = () => allCats().filter(c => c.archived);
const catVisible = id => !!(S.cats[id] && !S.cats[id].deleted && !S.cats[id].archived);
const rtVisible = r => !r.deleted && !r.archived && catVisible(r.categoryId);
/* 직접 끌어 옮긴 순서(order)가 있으면 그 순서, 없으면 시간 → 만든 순 */
const cmpTask = (a, b) => {
  const oa = a.order ?? null, ob = b.order ?? null;
  if (oa !== null && ob !== null && oa !== ob) return oa - ob;
  if (oa !== null && ob === null) return -1;
  if (oa === null && ob !== null) return 1;
  return (a.time || '~').localeCompare(b.time || '~') || ((a.createdAt || 0) - (b.createdAt || 0));

/* ───────── 서버 통신 (순서 보장 큐 + 주기적 새로고침) ───────── */
const CONN_KEY = 'todo.conn', CACHE_KEY = 'todo.cache';
let CONN = null;
try { CONN = JSON.parse(store.get(CONN_KEY) || 'null'); } catch (e) {}
const IS_APP = !!window.TodoAndroid;
async function api(fn, ...args){
  return callServer(CONN, fn, args);
}
async function callServer(conn, fn, args){
  let r;
  try { r = await fetch(conn.url, { method: 'POST', body: JSON.stringify({ token: conn.token, fn, args }) }); }
  catch (e) { throw new Error('서버에 연결할 수 없어요 (인터넷 또는 서버 주소 확인)'); }
  if (!r.ok) throw new Error('서버 응답 오류 (' + r.status + ')');
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('서버 주소가 올바르지 않거나, 웹 앱 액세스가 "모든 사용자"가 아니에요'); }
  if (!j.ok) throw new Error(j.error || '서버 오류');

}
let queue = Promise.resolve(), inflight = 0, writeSeq = 0;
const pendingIds = {};
function enqueue(id, fn){
  pendingIds[id] = (pendingIds[id] || 0) + 1; inflight++; setSync();
  queue = queue.then(fn).then(() => { S.syncErr = false; }, err => {
    S.syncErr = true; toast('저장 실패 — 인터넷 연결을 확인해 주세요');
    console.error(err);
  }).finally(() => {
    if (--pendingIds[id] <= 0) delete pendingIds[id];
    inflight--; writeSeq++; setSync();
    if (inflight === 0 && S.syncErr) setTimeout(refresh, 1500);
  });
}
function setSync(){ const el = $('#sync'); el.className = 'sync' + (inflight ? ' saving' : S.syncErr ? ' error' : ''); }

let refreshing = false;
async function refresh(){
  if (!CONN || refreshing) return; refreshing = true;
  const seq = writeSeq, { from, to } = rangeFor(S.ym);
  try {
    const d = await api('load', from, to);
    if (seq === writeSeq && inflight === 0) { applyLoad(d); S.syncErr = false; setSync(); }
  } catch (e) {
    if (!S.syncErr) toast(e.message);
    S.syncErr = true; setSync(); console.error(e);
  }
  finally { refreshing = false; }
}
function applyLoad(d){
  if (d.today && d.today !== S.today){ if (S.sel === S.today) S.sel = d.today; S.today = d.today; }
  S.cats = byId(d.categories);
  S.routines = byId(d.routines);
  if (d.settings) S.prefs = d.settings;
  for (const id in S.tasks){ const t = S.tasks[id]; if (t.date >= d.from && t.date <= d.to && !pendingIds[id]) delete S.tasks[id]; }
  d.tasks.forEach(t => { if (!pendingIds[t.id]) S.tasks[t.id] = t; });
  render();
}

/* ───────── 할일 조작 ───────── */
function saveTask(t){

  enqueue(t.id, () => api('saveTask', S.tasks[t.id] || t));
}
function moveTasks(ids, date){
  ids = ids.filter(id => S.tasks[id] && S.tasks[id].date !== date);
  if (!ids.length) return;
  ids.forEach(id => { const t = S.tasks[id]; S.tasks[id] = { ...t, movedFrom: t.movedFrom || t.date, date }; });
  render();
  enqueue('move', () => api('moveTasks', ids, date));
  toast(`${ids.length}개를 ${dateLabel(date)}로 옮겼어요`);
}
function dateLabel(d){
  if (d === S.today) return '오늘';
  if (d === addDays(S.today, 1)) return '내일';
  const [, m, dd] = P(d); return `${m}월 ${dd}일`;
}
function removeTask(id){

}
function newTask(fields){
  return Object.assign({ id: uid(), title:'', categoryId:'', date:S.sel, time:'', endTime:'', alarm:'', due:'', memo:'', done:false, createdAt: Date.now() }, fields);
}
function addFromRoutine(rid){
  const r = S.routines[rid]; if (!r) return;
  saveTask(newTask({ title:r.title, categoryId:r.categoryId, date:S.sel, time:r.time || '', endTime:r.endTime || '', alarm: hasVal(r.alarm) ? r.alarm : '', routineId:r.id, key:r.id + '|' + S.sel }));
}

/* ───────── 렌더링 ───────── */
function tasksByDate(){
  const m = {};
  for (const t of Object.values(S.tasks)){ if (!catVisible(t.categoryId)) continue; (m[t.date] = m[t.date] || []).push(t); }
  return m;
}
function render(){ if (typeof Drag !== 'undefined' && Drag.st) return; renderHeader(); const idx = tasksByDate(); renderCal(idx); renderDay(idx); if (S.settings) renderSettings(); afterRender(idx); }

/* 화면이 바뀔 때마다: 기기에 캐시 저장(빠른 시작용) + 안드로이드 위젯 갱신 */
let afterTimer = null, afterPending = null;
function afterRender(idx){
  clearTimeout(afterTimer);
  afterPending = idx;
  afterTimer = setTimeout(flushAfter, 400);
}
function flushAfter(){
  clearTimeout(afterTimer);
  const idx = afterPending; afterPending = null;
  if (!idx) return;
  {
    const lo = addDays(S.today, -60), hi = addDays(S.today, 120);
    store.set(CACHE_KEY, JSON.stringify({ cats: Object.values(S.cats), routines: Object.values(S.routines), prefs: S.prefs,
      tasks: Object.values(S.tasks).filter(t => t.date >= lo && t.date <= hi) }));
    if (!IS_APP) return;
    pushUpcoming();
    const list = (idx[S.today] || []), left = list.filter(t => !t.done)
      .sort((a, b) => ((S.cats[a.categoryId].order ?? 0) - (S.cats[b.categoryId].order ?? 0)) || cmpTask(a, b));
    try {
      window.TodoAndroid.updateWidget(JSON.stringify({ date: S.today, total: list.length, done: list.length - left.length,
        items: left.map(t => ({ id: t.id, title: t.title, time: t.time || '', color: S.cats[t.categoryId].color, cat: S.cats[t.categoryId].name })) }));
    } catch (e) {}
  }
}
addEventListener('pagehide', flushAfter);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushAfter(); });

/* 휴대폰 잠금화면 알림용으로 앞으로 8일 안의 할일을 앱에 전달 */
function pushUpcoming(){

  const until = addDays(S.today, 8);
  const list = Object.values(S.tasks).filter(t => !t.done && catVisible(t.categoryId) && ((t.date >= S.today && t.date <= until) || (t.due && t.due >= S.today && t.due <= until)))
    .map(t => ({ id: t.id, title: t.title, date: t.date, time: t.time || '', alarm: hasVal(t.alarm) ? String(t.alarm) : '', due: t.due || '', cat: S.cats[t.categoryId].name }));

/* 안드로이드 뒤로가기: 열린 창부터 닫기 */

function renderCal(idx){

  if (S.week){ start = addDays(S.sel, -dow(S.sel)); cells = 7; }

/* 달력 날짜 표시: 완료한 할일의 카테고리 색으로 채움 (완료한 순서대로, 최근 4개) */
function dayBadge(list, left){
  const done = list.filter(t => t.done).sort((a, b) => (a.doneAt || a.createdAt || 0) - (b.doneAt || b.createdAt || 0));
  const colors = done.slice(-4).map(t => S.cats[t.categoryId].color);
  const label = !list.length ? '' : left ? `<span>${left}</span>` : CHECK;
  const colored = colors.length ? ' colored' : '';
  if (S.look.badge === 'gradient'){
    let bg = '';
    if (colors.length === 1) bg = colors[0];
    else if (colors.length > 1){
      const pos = ['20% 20%', '85% 25%', '25% 85%', '85% 85%'];
      bg = colors.map((c, i) => `radial-gradient(circle at ${pos[i]}, ${c} 0%, ${c}00 75%)`).join(',') + ',' + colors[colors.length - 1];
    }
    const op = colors.length && left ? ';opacity:.75' : '';

function metaHtml(t){

  if (t.routineId) m.push('<span>↻</span>');
  if (t.due){
    const diff = dayNum(t.due) - dayNum(S.today);
    const label = diff > 0 ? 'D-' + diff : diff === 0 ? 'D-Day' : 'D+' + (-diff);
    m.push(`<span class="dday ${diff <= 1 && !t.done ? 'urgent' : ''}">${label}</span>`);
  }

  if (t.movedFrom && t.movedFrom !== t.date){ const [, mm, dd] = P(t.movedFrom); m.push(`<span>↪ ${mm}/${dd}에서</span>`); }

}
function renderDay(idx){
  const box = $('#day');
  const inp = $('#newInput'), keep = inp ? { v: inp.value, f: document.activeElement === inp } : null;
  const cats = sortedCats(), list = idx[S.sel] || [];
  const [, m, d] = P(S.sel);
  let h = `<div class="dayhead"><span class="dt">${m}월 ${d}일 ${WD[dow(S.sel)]}요일</span>${list.length ? `<span class="pr">${list.filter(t => t.done).length}/${list.length} 완료</span>` : ''}${list.some(t => !t.done) ? `<button class="mini carry" data-carry="1">미완료 ${list.filter(t => !t.done).length}개 넘기기 ›</button>` : ''}</div>`;

    }
    if (S.adding === c.id){
      h += `<div class="task adding" style="--c:${ink(c.color)}"><span class="chk"></span><form id="newForm"><input id="newInput" placeholder="할일 입력 후 Enter" enterkeyhint="done" autocomplete="off"></form></div>`;
    }

  try { box.innerHTML = h; } finally { S.rendering = false; }
  const ni = $('#newInput');

}

/* ───────── 메인 화면 이벤트 ───────── */
document.addEventListener('click', e => {
  if (Date.now() < Drag.suppressUntil) return;
  const el = e.target.closest('button,[data-edit],[data-addr]');
  if (!el || el.closest('#overlay,#dialog,#settings')) return;
  const ds = el.dataset;
  if (ds.date){ S.sel = ds.date; if (ds.date.slice(0, 7) !== S.ym){ S.ym = ds.date.slice(0, 7); render(); refresh(); } else render(); return; }
  if (ds.chk){ const t = S.tasks[ds.chk]; saveTask({ ...t, done: !t.done, doneAt: t.done ? 0 : Date.now() }); return; }
  if (ds.edit){ openTaskEditor(ds.edit); return; }
  if (ds.addr){ addFromRoutine(ds.addr); return; }
  if (ds.carry){ openCarrySheet(); return; }
  if (ds.add){ S.adding = ds.add; render(); const i = $('#newInput'); i && i.focus(); return; }
  switch (el.id){
    case 'prevBtn': move(-1); break;
    case 'nextBtn': move(1); break;
    case 'todayBtn': goto(S.today); break;
    case 'ymBtn': S.week = !S.week; store.set('weekMode', S.week ? '1' : '0'); render(); break;
    case 'setBtn': openSettings(); break;
  }
});
function goto(d){ const ym = d.slice(0, 7); S.sel = d; const changed = ym !== S.ym; S.ym = ym; render(); if (changed) refresh(); }
function move(n){
  if (S.week) goto(addDays(S.sel, 7 * n));

/* ───────── 끌어서 옮기기 (할일·루틴, 카테고리 사이도 가능) ─────────
   휴대폰: 길게 누른 뒤 끌기 / PC: 마우스로 바로 끌기 */
const Drag = { st: null, suppressUntil: 0 };
function dragStart(el, x, y){
  const r = el.getBoundingClientRect();
  const ghost = el.cloneNode(true); ghost.classList.add('dnd-ghost');
  ghost.style.width = r.width + 'px'; ghost.style.left = r.left + 'px'; ghost.style.top = r.top + 'px';
  document.body.appendChild(ghost); el.classList.add('dnd-src'); document.body.classList.add('dnd-on');
  Drag.st = { el, ghost, kind: el.dataset.dnd, dx: x - r.left, dy: y - r.top, x, y, raf: 0 };
  if (navigator.vibrate) try { navigator.vibrate(15); } catch (e) {}
  autoScroll();
}
function dragMove(x, y){
  const d = Drag.st; if (!d) return;
  d.x = x; d.y = y;
  d.ghost.style.left = (x - d.dx) + 'px'; d.ghost.style.top = (y - d.dy) + 'px';
  d.ghost.style.display = 'none';
  const under = document.elementFromPoint(x, y);
  d.ghost.style.display = '';
  if (!under) return;
  let group = under.closest(`[data-dnd-group="${d.kind}"]`);
  if (!group){ const wrap = under.closest(d.kind === 'task' ? '.cat' : '.rt-cat'); if (wrap) group = wrap.querySelector(`[data-dnd-group="${d.kind}"]`); }
  if (!group) return;
  const items = [...group.querySelectorAll(`:scope > [data-dnd="${d.kind}"]`)].filter(n => n !== d.el);
  const before = items.find(n => { const rr = n.getBoundingClientRect(); return y < rr.top + rr.height / 2; });
  const empty = group.querySelector(':scope > .rt-empty'); if (empty) empty.remove();
  if (before) { if (before.previousElementSibling !== d.el) group.insertBefore(d.el, before); }
  else if (group.lastElementChild !== d.el) group.appendChild(d.el);
}
function autoScroll(){
  const d = Drag.st; if (!d) return;
  const box = d.el.closest('#settings') ? $('#settings') : null, edge = 70, h = innerHeight;
  const v = d.y < edge ? -12 : d.y > h - edge ? 12 : 0;
  if (v){ if (box) box.scrollTop += v; else scrollBy(0, v); dragMove(d.x, d.y); }
  d.raf = requestAnimationFrame(autoScroll);
}
function dragEnd(cancel){
  const d = Drag.st; if (!d) return;
  Drag.st = null; cancelAnimationFrame(d.raf);
  d.ghost.remove(); d.el.classList.remove('dnd-src'); document.body.classList.remove('dnd-on');
  Drag.suppressUntil = Date.now() + 350;
  if (cancel){ render(); return; }
  const group = d.el.parentElement, cat = group && group.dataset.cat, id = d.el.dataset.id;
  const ids = [...group.querySelectorAll(`:scope > [data-dnd="${d.kind}"]`)].map(n => n.dataset.id);
  if (d.kind === 'task') dropTask(id, cat, ids); else dropRoutine(id, cat, ids);
}
function dropTask(id, cat, ids){
  const changed = [];
  ids.forEach((tid, i) => {
    const t = S.tasks[tid]; if (!t) return;
    const nt = { ...t, order: i }; if (tid === id) nt.categoryId = cat;
    if (nt.order !== t.order || nt.categoryId !== t.categoryId){ S.tasks[tid] = nt; changed.push(tid); }
  });
  render();
  changed.forEach(tid => enqueue(tid, () => api('saveTask', S.tasks[tid])));
  if (S.tasks[id] && changed.includes(id) && S.cats[cat]) toast(`'${S.cats[cat].name}'(으)로 옮겼어요`);
}
function dropRoutine(id, cat, ids){
  const moved = S.routines[id] && S.routines[id].categoryId !== cat, changed = [];
  ids.forEach((rid, i) => {
    const r = S.routines[rid]; if (!r) return;
    const nr = { ...r, order: i }; if (rid === id) nr.categoryId = cat;
    if (nr.order !== r.order || nr.categoryId !== r.categoryId){ S.routines[rid] = nr; changed.push(rid); }
  });
  // 루틴을 다른 카테고리로 옮기면 오늘 이후의 그 루틴 할일도 같이 옮김
  if (moved) Object.values(S.tasks).filter(t => t.routineId === id && t.date >= S.today && t.categoryId !== cat)
    .forEach(t => { S.tasks[t.id] = { ...t, categoryId: cat }; enqueue(t.id, () => api('saveTask', S.tasks[t.id])); });
  render();
  changed.forEach(rid => enqueue(rid, () => api('saveRoutine', S.routines[rid], 'none')));
  if (moved && S.cats[cat]) toast(`루틴을 '${S.cats[cat].name}'(으)로 옮겼어요`);
}
(function(){
  let pend = null;
  const canStart = t => !t.closest('.chk, input, textarea, select, .plus, a');
  // 터치: 길게 누르기(0.35초) 후 끌기, 그 전에 움직이면 일반 스크롤
  document.addEventListener('touchstart', e => {
    if (Drag.st || e.touches.length !== 1) return;
    const el = e.target.closest('[data-dnd]'); if (!el || !canStart(e.target)) return;
    const t = e.touches[0];
    pend = { el, x: t.clientX, y: t.clientY, timer: setTimeout(() => { if (pend) { dragStart(pend.el, pend.x, pend.y); pend = null; } }, 350) };
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (Drag.st){ e.preventDefault(); dragMove(t.clientX, t.clientY); return; }
    if (pend && Math.hypot(t.clientX - pend.x, t.clientY - pend.y) > 8){ clearTimeout(pend.timer); pend = null; }
    else if (pend){ pend.x = t.clientX; pend.y = t.clientY; }
  }, { passive: false });
  const endTouch = cancel => { if (pend){ clearTimeout(pend.timer); pend = null; } if (Drag.st) dragEnd(cancel); };
  document.addEventListener('touchend', () => endTouch(false));
  document.addEventListener('touchcancel', () => endTouch(true));
  document.addEventListener('contextmenu', e => { if (e.target.closest('[data-dnd]')) e.preventDefault(); });
  // 마우스: 누른 채 6px 이상 움직이면 끌기
  let mpend = null;
  document.addEventListener('mousedown', e => {
    if (e.button !== 0 || Drag.st) return;
    const el = e.target.closest('[data-dnd]'); if (!el || !canStart(e.target)) return;
    mpend = { el, x: e.clientX, y: e.clientY };
  });
  document.addEventListener('mousemove', e => {
    if (Drag.st){ e.preventDefault(); dragMove(e.clientX, e.clientY); return; }
    if (mpend && Math.hypot(e.clientX - mpend.x, e.clientY - mpend.y) > 6){ dragStart(mpend.el, mpend.x, mpend.y); dragMove(e.clientX, e.clientY); mpend = null; }
  });
  document.addEventListener('mouseup', () => { mpend = null; if (Drag.st) dragEnd(false); });
})();

function openCarrySheet(){

    .sort((a, b) => (S.cats[a.categoryId].order - S.cats[b.categoryId].order) || cmpTask(a, b));

function openTaskEditor(id){

  openSheet(`

    <div class="field nw"><label>시간</label><input type="time" id="e_time" value="${t.time || ''}"><span>~</span><input type="time" id="e_end" value="${t.endTime || ''}"><button class="x" data-act="clrtime" aria-label="시간 지우기">✕</button></div>

  async (b, e) => {

function rtSummary(r){

  const consecutive = ord.length >= 3 && ord.every((d, i) => i === 0 || (ord[i - 1] + 1) % 7 === d);
  const days = ord.length === 5 && consecutive && ord[0] === 1 ? '월~금' : ord.length === 2 && ord.includes(0) && ord.includes(6) ? '토·일'
    : consecutive ? WD[ord[0]] + '~' + WD[ord[ord.length - 1]] : ord.map(d => WD[d]).join('·');
  let s = r.repeat === 'daily' ? '매일' : r.repeat === 'weekly' ? '매주 ' + days : r.repeat === 'monthly' ? `매월 ${r.monthDay}일` : `${r.every}일마다`;
  if (r.time) s += ' · ' + r.time;
  if (r.time && hasVal(r.alarm)) s += ' 🔔';
  s += r.autoAdd ? ' · 자동 추가' : ' · 직접 추가';

  return s;
}

function rtStatus(r){
  if (r.archived || S.cats[r.categoryId]?.archived) return ['보관', 'var(--sub)'];
  if (r.end && r.end < S.today) return ['종료', 'var(--danger)'];
  if (r.start && r.start > S.today) return ['예정', 'var(--warn)'];
  return ['진행 중', 'var(--accent)'];
}
function rtRow(r){
  const [st, col] = rtStatus(r);
  const rep = rtSummary({ ...r, time: '', alarm: '', end: '' }).replace(/ · (자동|직접) 추가$/, '');
  const tm = r.time ? (+r.time.slice(0, 2) < 12 ? '오전 ' : '오후 ') + ((+r.time.slice(0, 2) % 12) || 12) + ':' + r.time.slice(3) : '';
  const parts = [`${fmtD(r.start)} ~ ${r.end ? fmtD(r.end) : ''}`, rep, tm, r.autoAdd ? '자동' : ''].filter(Boolean);
  return `<div class="rt-row" data-editrt="${r.id}" ${r.archived || S.cats[r.categoryId]?.archived ? '' : `data-dnd="routine" data-id="${r.id}"`} role="button">
    <div class="m"><div><span class="st" style="color:${col}">${st}</span><span class="bar">|</span><span class="t">${esc(r.title)}</span></div><div class="d">${esc(parts.join(' / '))}</div></div><span class="go">›</span></div>`;
}
const fmtD = d => { if (!d) return ''; const [y, m, dd] = P(d); return `${y}. ${m}. ${dd}.`; };

    <div class="tabs"><button class="${tab === 'cats' ? 'on' : ''}" data-tab="cats">카테고리</button><button class="${tab === 'routines' ? 'on' : ''}" data-tab="routines">루틴</button><button class="${tab === 'info' ? 'on' : ''}" data-tab="info">기타</button></div>`;

      <button class="li-main" data-editcat="${c.id}"><span>${esc(c.name)}</span>${c.gcal ? '<span class="tag">📅 구글캘린더 연동</span>' : ''}</button>
      <button class="icon-btn" data-up="${c.id}" ${i === 0 ? 'disabled' : ''} aria-label="위로">↑</button>
      <button class="icon-btn" data-down="${c.id}" ${i === cats.length - 1 ? 'disabled' : ''} aria-label="아래로">↓</button></div>`).join('') + '</div>'

    if (arch.length) h += `<div class="sec-h">📦 보관한 카테고리 ${arch.length}개</div><div class="tip">메인 화면에서는 숨겨져요. 할일·루틴은 그대로 남아 있어요.</div><div class="list archived">` + arch.map(c => `<div class="li"><span class="dot" style="background:${c.color}"></span>
      <button class="li-main" data-editcat="${c.id}"><span>${esc(c.name)}</span></button><button class="mini" data-unarchcat="${c.id}">꺼내기</button></div>`).join('') + '</div>';
  } else if (tab === 'routines'){
    h += `<div class="tip">카테고리의 ＋로 루틴을 추가하고, 루틴을 길게 눌러 끌면 순서나 카테고리를 바꿀 수 있어요.</div>`;
    const live = Object.values(S.routines).filter(r => !r.deleted && S.cats[r.categoryId] && !S.cats[r.categoryId].deleted);
    const group = (c, rs, archived) => `<div class="rt-cat ${archived ? 'archived' : ''}"><div class="rt-head"><b style="color:${ink(c.color)}">${esc(c.name)}${c.archived ? ' <span style="font-size:12px;color:var(--sub)">(보관됨)</span>' : ''}</b>${archived ? '' : `<button class="plus" data-newrt-cat="${c.id}" aria-label="${esc(c.name)} 루틴 추가">＋</button>`}</div>
      <div class="rt-list" ${archived ? '' : `data-dnd-group="routine" data-cat="${c.id}"`}>${rs.map(rtRow).join('') || (archived ? '' : '<div class="rt-empty">루틴 없음</div>')}</div></div>`;
    for (const c of sortedCats()) h += group(c, live.filter(r => r.categoryId === c.id && !r.archived).sort(cmpRoutine), false);
    const arch = live.filter(r => r.archived || S.cats[r.categoryId].archived);
    if (arch.length){
      h += `<div class="sec-h">📦 보관한 루틴 ${arch.length}개</div><div class="tip">메인 화면에 보이지 않고 자동 추가도 멈춰요. 눌러서 꺼낼 수 있어요.</div>`;
      for (const c of allCats()){ const rs = arch.filter(r => r.categoryId === c.id).sort(cmpRoutine); if (rs.length) h += group(c, rs, true); }
    }
  } else {
    const code = CONN ? btoa(JSON.stringify({ u: CONN.url, t: CONN.token })) : '';
    const apk = !IS_APP && apkUrl();
    h += `<div class="list" style="margin-bottom:14px">
      <div class="li" style="padding:14px;flex-wrap:wrap"><div class="li-main"><span>📱 다른 기기 연결</span>
        <span class="s">이 코드를 다른 기기의 연결 화면 첫 칸에 붙여넣으면 바로 연결돼요. 남에게 보여주지 마세요.</span></div>
        <button class="mini" data-act="copyconn">기기 연결 코드 복사</button>
        <textarea class="codebox" readonly id="connCode">${esc(code)}</textarea></div>
      ${apk ? `<div class="li" style="padding:14px"><div class="li-main"><span>🤖 안드로이드 앱 + 위젯</span><span class="s">홈 화면 위젯으로 오늘 남은 할일을 볼 수 있어요</span></div><a class="mini" style="text-decoration:none;color:inherit" href="${apk}">APK 받기</a></div>` : ''}
      <div class="li" style="padding:14px"><div class="li-main"><span>연결 해제</span><span class="s">이 기기에서만 연결을 끊어요. 데이터는 그대로예요.</span></div><button class="mini" style="color:var(--danger)" data-act="disconnect">해제</button></div>
    </div>
    <div class="list" style="margin-bottom:14px">
      <div class="li" style="padding:14px;flex-wrap:wrap;gap:10px"><div class="li-main"><span>🎨 화면 테마</span><span class="s">이 기기에만 적용돼요</span></div>
        <div class="chips">${[['system','시스템'],['light','흰색'],['dark','검정']].map(([k, l]) => `<button class="opt ${S.look.theme === k ? 'on' : ''}" data-theme-set="${k}">${l}</button>`).join('')}</div></div>
      <div class="li" style="padding:14px;flex-wrap:wrap;gap:10px"><div class="li-main"><span>🍀 달력 완료 표시</span><span class="s">완료한 할일의 카테고리 색으로 날짜가 채워져요</span></div>
        <div class="chips">${[['clover','4분할'],['gradient','그라데이션']].map(([k, l]) => `<button class="opt ${S.look.badge === k ? 'on' : ''}" data-badge-set="${k}">${l}</button>`).join('')}</div></div>
      ${IS_APP && window.TodoAndroid.widgetStatus ? `<div class="li" style="padding:14px"><div class="li-main"><span>🧩 위젯 상태</span><span class="s" id="wStatus">${esc(window.TodoAndroid.widgetStatus())}</span></div></div>` : ''}

        <button class="mini" data-act="copyerr">복사</button><button class="mini" data-act="clearerr">지우기</button>
        <textarea class="codebox" readonly id="errBox">${esc(window.TodoAndroid.errorReport())}</textarea></div>` : ''}
    </div>
    ${notifySection()}
    <div class="list" style="margin-bottom:14px"><div class="li" style="padding:14px"><div class="li-main"><span>못 한 일 자동으로 넘기기</span>
      <span class="s">매일 자정, 지난 7일 동안 완료 못 한 할일을 오늘로 옮겨요 (루틴 할일은 제외)</span></div>
      <input type="checkbox" class="sw" id="p_carry" ${S.prefs && S.prefs.autoCarry ? 'checked' : ''}></div></div>
      <div class="info">
      <h4>✋ 끌어서 옮기기</h4><p>할일을 길게 누른 뒤 끌면(PC는 마우스로 끌기) 순서를 바꾸거나 다른 카테고리로 옮길 수 있어요. 루틴도 ⚙ 설정 → 루틴에서 같은 방법으로 옮겨요.</p>
      <h4>📦 보관하기</h4><p>더 안 쓰는 카테고리나 루틴은 편집 화면에서 "보관하기"를 누르면 메인 화면에서 숨겨져요. 지우지 않으니 언제든 꺼낼 수 있어요.</p>
      <h4>↪ 할일 넘기기</h4><p>날짜 제목 옆 [미완료 N개 넘기기]를 누르면 못 한 할일을 골라 내일, 오늘 또는 원하는 날짜로 한 번에 옮길 수 있어요. 하나만 옮길 때는 할일을 눌러 [내일 하기] 또는 [다른 날로]를 쓰세요. 옮겨진 할일에는 "↪ 원래 날짜"가 표시돼요.</p>
      <h4>🔄 동기화</h4><p>모든 데이터는 내 구글 드라이브의 "TodoTracker 데이터" 시트 (예전에 만든 경우 "나의 할일 데이터")에 저장돼요. 폰·PC·안드로이드 앱이 같은 서버에 연결되어 자동으로 맞춰지고, 다른 기기에서 바꾼 내용은 20초 안에(또는 앱으로 돌아올 때) 반영돼요. 제목 옆 점이 초록색이면 저장 완료, 주황색이면 저장 중이에요.</p>
      <h4>✏️ 빠르게 추가</h4><p>오른쪽 아래 ＋ 버튼을 누르고 "내일 오후 3시 치과", "금요일까지 레포트 제출"처럼 말하듯 적으면 날짜·시간·기한·카테고리를 알아서 채워요. "매주 월~금 오전 8시 학원 11월만", "매일 듀오링고", "화목 7시 운동 2주 동안"처럼 반복을 적으면 루틴(반복 일정)으로 만들어요. 한 줄에 하나씩 여러 개를 한 번에 넣을 수 있고, 저장 전에 카테고리를 바꿀 수 있어요. "#카테고리"로 직접 정할 수도 있어요.</p>
      <h4>🔔 시간 알림</h4><p>기본은 구글캘린더 "할일 알림" 캘린더로 알려요. 안드로이드 앱에서 "잠금화면 알림"을 켜면 앱이 직접 알려 주고, 알림에서 바로 완료할 수도 있어요.</p>

      <h4>↻ 루틴</h4><p>"자동 추가"를 켜면(시작일·종료일 필수) 매일 자정에 앞으로 7일치 할일이 자동으로 생겨요. 빠르게 추가로 만든 루틴은 수동으로 시작해요. 끄면 해당 요일에 흐리게 표시되고 눌러서 바로 넣을 수 있어요. 자동 추가된 할일을 지우면 그날은 다시 생기지 않아요.</p>
      <h4>📌 기한</h4><p>할일에 기한을 정하면 D-day가 표시돼요. 기한이 하루 이내로 남으면 빨간색으로 바뀌어요.</p></div>`;
  }
  $('#settings').innerHTML = h + '</div>';
}
$('#settings').addEventListener('change', e => {
  if (e.target.id === 'rp_on' || e.target.id === 'rp_morning'){
    const r = reminderPrefs();
    if (e.target.id === 'rp_on') r.enabled = e.target.checked; else r.morning = e.target.checked;
    saveReminderPrefs(r); renderSettings();
    if (e.target.id === 'rp_on') toast(r.enabled ? '잠금화면 알림을 켰어요' : '잠금화면 알림을 껐어요 (캘린더 알림으로 돌아가요)');
    return;
  }
  if (e.target.id !== 'p_carry') return;
  S.prefs = { ...(S.prefs || {}), autoCarry: e.target.checked };
  const prefs = S.prefs;
  enqueue('prefs', () => api('saveSettings', prefs));
  toast(prefs.autoCarry ? '매일 자정에 못 한 일을 오늘로 옮겨요' : '자동 넘기기를 껐어요');
});
$('#settings').addEventListener('click', e => {
  if (Date.now() < (Drag.suppressUntil || 0)) return;
  const b = e.target.closest('button,[data-editrt]'); if (!b) return;
  const ds = b.dataset;
  if (ds.act === 'back'){ S.settings = null; $('#settings').classList.add('hidden'); render(); return; }
  if (ds.act === 'copyconn'){ copyText($('#connCode').value); return; }
  if (ds.act === 'copyerr'){ copyText($('#errBox').value); return; }
  if (ds.act === 'clearerr'){ try { window.TodoAndroid.clearErrors(); } catch (e) {} renderSettings(); return; }
  if (ds.themeSet){ S.look.theme = ds.themeSet; store.set('todo.theme', ds.themeSet); applyTheme(); renderSettings(); return; }
  if (ds.rp){ const r = reminderPrefs(); r[ds.rp] = ds.rp === 'offset' ? Number(ds.v) : ds.v; saveReminderPrefs(r); renderSettings(); return; }
  if (ds.badgeSet){ S.look.badge = ds.badgeSet; store.set('todo.badge', ds.badgeSet); renderSettings(); render(); return; }
  if (ds.act === 'disconnect'){
    confirmBox('이 기기에서 연결을 해제할까요?\n(서버의 데이터는 지워지지 않아요)', '해제').then(ok => {
      if (!ok) return;
      try { localStorage.removeItem(CONN_KEY); localStorage.removeItem(CACHE_KEY); } catch (e) {}
      if (IS_APP) try { window.TodoAndroid.setConnection('', ''); } catch (e) {}
      location.reload();
    });
    return;
  }
  if (ds.tab){ S.settings = ds.tab; renderSettings(); return; }
  if (ds.act === 'newcat' || ds.editcat) return openCatEditor(ds.editcat);
  if (ds.act === 'newrt' || ds.editrt) return openRoutineEditor(ds.editrt);
  if (ds.newrtCat) return openRoutineEditor(null, ds.newrtCat);
  if (ds.unarchcat){ const c = { ...S.cats[ds.unarchcat], archived: false }; S.cats[c.id] = c; render(); enqueue(c.id, () => api('saveCategory', c)); toast(`'${c.name}'을(를) 꺼냈어요`); return; }
  if (ds.up || ds.down){
    const cats = sortedCats(), i = cats.findIndex(c => c.id === (ds.up || ds.down)), j = ds.up ? i - 1 : i + 1;
    [cats[i], cats[j]] = [cats[j], cats[i]];
    cats.forEach((c, k) => { S.cats[c.id] = { ...c, order: k }; });
    const ids = cats.map(c => c.id);
    render(); enqueue('order', () => api('reorderCategories', ids));
  }
});

function openCatEditor(id){
  const isNew = !id;
  const used = new Set(sortedCats().map(c => c.color));
  const c = isNew ? { id: uid(), name: '', color: DEFAULT_COLORS.find(p => !used.has(p)) || PALETTE[Math.floor(Math.random() * PALETTE.length)], gcal: false, order: sortedCats().length }
                  : { ...S.cats[id] };
  openSheet(`
    <div class="sh-h"><button class="btn" data-act="close">닫기</button><b>${isNew ? '새 카테고리' : '카테고리 편집'}</b><button class="btn pri" data-act="save">저장</button></div>
    <input id="c_name" class="big" value="${esc(c.name)}" placeholder="카테고리 이름" maxlength="20">
    <div class="lbl">색상</div>
    <div class="swatches" id="c_sw">${PALETTE.map(p => `<button class="swc ${p === c.color.toUpperCase() ? 'on' : ''}" style="--c:${p}" data-color="${p}" aria-label="${p}"></button>`).join('')}</div>
    <div class="custom-color"><input type="color" id="c_custom" value="${c.color}"><span>직접 고르기</span><span class="chip preview-chip" id="c_prev" style="--c:${ink(c.color)}">${esc(c.name || '미리보기')}</span></div>
    <div class="field" style="margin-top:12px"><label class="grow" style="width:auto;color:var(--text)">📅 구글캘린더 연동</label><input type="checkbox" class="sw" id="c_gcal" ${c.gcal ? 'checked' : ''}>
      <span class="hint" style="padding-left:0">켜면 이 카테고리의 할일이 내 구글캘린더에 일정으로 등록돼요.</span></div>
    ${isNew ? '' : `<div class="acts"><button class="btn" data-act="archive">${c.archived ? '📤 꺼내기' : '📦 보관하기'}</button><button class="btn danger" data-act="del">카테고리 삭제</button></div>
      <div class="note">보관하면 메인 화면과 빠른 추가에서 숨겨지고, 할일과 루틴은 지워지지 않아요.</div>`}`,
  async (b, e) => {
    if (!b){
      if (e && e.target.id === 'c_custom'){ c.color = e.target.value.toUpperCase(); $('#c_sw').querySelectorAll('.on').forEach(x => x.classList.remove('on')); $('#c_prev').style.setProperty('--c', ink(c.color)); }
      if (e && e.target.id === 'c_name') $('#c_prev').textContent = e.target.value || '미리보기';
      return;
    }
    if (b.dataset.color){ c.color = b.dataset.color; pickOne($('#c_sw'), b); $('#c_custom').value = c.color; $('#c_prev').style.setProperty('--c', ink(c.color)); return; }
    switch (b.dataset.act){
      case 'close': closeSheet(); break;
      case 'save': {
        c.name = $('#c_name').value.trim(); c.gcal = $('#c_gcal').checked;
        if (!c.name) return toast('이름을 입력해 주세요');
        S.cats[c.id] = c; closeSheet(); render();
        enqueue(c.id, () => api('saveCategory', c));
        break;
      }
      case 'archive': {
        c.name = $('#c_name').value.trim() || c.name; c.archived = !c.archived;
        S.cats[c.id] = c; closeSheet(); render();
        enqueue(c.id, () => api('saveCategory', c));
        toast(c.archived ? `'${c.name}'을(를) 보관했어요 (⚙ 카테고리 아래에서 꺼낼 수 있어요)` : `'${c.name}'을(를) 꺼냈어요`);
        break;
      }
      case 'del': {
        if (!await confirmBox(`'${c.name}' 카테고리를 삭제할까요?\n안에 있는 할일과 루틴도 모두 삭제돼요.\n(지우기 아까우면 '보관하기'를 쓰세요)`)) return;
        delete S.cats[c.id];
        for (const t of Object.values(S.tasks)) if (t.categoryId === c.id) delete S.tasks[t.id];
        for (const r of Object.values(S.routines)) if (r.categoryId === c.id) delete S.routines[r.id];
        closeSheet(); render();
        enqueue(c.id, () => api('deleteCategory', c.id));
        break;
      }
    }
  });
  if (isNew) setTimeout(() => $('#c_name') && $('#c_name').focus(), 50);
}

function openRoutineEditor(id, presetCat){
  const isNew = !id;
  const firstCat = (presetCat && S.cats[presetCat]) || sortedCats()[0];
  if (isNew && !firstCat) return toast('먼저 카테고리를 만들어 주세요');
  const r = isNew
    ? { id: uid(), title: '', categoryId: firstCat.id, repeat: 'weekly', days: [dow(S.today)], monthDay: Number(S.today.slice(8)), every: 2,
        start: S.today, end: '', time: '', endTime: '', alarm: '', autoAdd: false, createdAt: Date.now() }
    : JSON.parse(JSON.stringify(S.routines[id]));
  const before = isNew ? null : JSON.parse(JSON.stringify(S.routines[id]));

  // 시간 (범위 포함)
  const T = '(오전|오후|아침|점심|낮|저녁|밤|새벽)?\\s*(\\d{1,2})(?:\\s*시(?!간)\\s*(?:(\\d{1,2})\\s*분|(반))?|:(\\d{2}))';
  m = cut(new RegExp(T + '(?:\\s*(?:부터|~|-|에서)\\s*' + T + ')?(\\s*까지)?'));
  if (m){
    const ctxAP = m[1] || (/(아침|오전|새벽|기상|모닝)/.test(raw) ? '오전' : /(저녁|밤|오후)/.test(raw) ? '오후' : '');
    r.time = to24(ctxAP, m[2], m[4] ? 30 : (m[3] || m[5]));
    if (m[7]) r.endTime = to24(m[6] || (/(오후|저녁|밤)/.test(ctxAP) ? '오후' : /(오전|아침|새벽)/.test(ctxAP) && +m[7] > +m[2] ? '오전' : ''), m[7], m[9] ? 30 : (m[8] || m[10]));
    if (r.endTime && r.endTime <= r.time) r.endTime = '';
  } else if (cut(/정오/)) r.time = '12:00';
  r.title = s.replace(/[,，]/g, ' ').replace(/\s(에|에는|까지|부터|에서|쯤|정도|에\s*있는|만)(?=\s)/g, ' ').replace(/\s+/g, ' ').trim().replace(/^(에|까지)\s+/, '');
  if (!r.title) r.title = raw.trim();
  if (!r.categoryId){ const c = guessCategory(raw); r.categoryId = c ? c.id : ''; }
  if (!r.date) r.date = S.sel;
  return r;
}
function openQuickAdd(){
  if (!sortedCats().length) return toast('먼저 카테고리를 만들어 주세요');
  let items = [];
  const fmt = d => { const [, mm, dd] = P(d); return `${mm}/${dd}(${WD[dow(d)]})`; };
  const preview = () => {
    const box = $('#qa_list');
    items = $('#qa_in').value.split('\n').map(x => x.trim()).filter(Boolean).map((line, i) => {
      const prev = items[i]; const it = parseQuick(line);
      if (prev && prev.line === line && prev.userCat) { it.categoryId = prev.categoryId; it.userCat = true; }
      it.line = line; return it;
    });
    box.innerHTML = items.length ? items.map((it, i) => { const c = S.cats[it.categoryId];
      const dl = dateLabel(it.date), meta = [`📅 ${/월/.test(dl) ? fmt(it.date) : dl + ' ' + fmt(it.date)}`];
      if (it.repeat){ meta.length = 0; meta.push('🔁 ' + rtSummary({ ...it, autoAdd: true }).replace(/ · 자동 추가.*/, '').replace(/ · \d\d:\d\d.*/, ''));
        if (it.once) meta[0] = '🗓 ' + (it.start === S.today || it.start <= addDays(S.today, (7 - dow(S.today)) % 7) ? '이번 주 ' : '다음 주 ') + meta[0].slice(2).replace('매주 ', '');
        meta.push(`📆 ${fmt(it.start)}${it.end ? ' ~ ' + fmt(it.end) : ' 부터 계속'}`); }
      if (it.time) meta.push(`⏰ ${it.time}${it.endTime ? '–' + it.endTime : ''}`);
      if (it.due) meta.push(`📌 ${fmt(it.due)}까지`);
      if (hasVal(it.alarm)) meta.push(`🔔 ${(ALARMS.find(a => a[0] === it.alarm) || [0, it.alarm + '분 전'])[1]}`);
      return `<div class="qa-row"><select data-qi="${i}" style="--c:${c ? ink(c.color) : 'inherit'}">${sortedCats().map(k => `<option value="${k.id}" ${k.id === it.categoryId ? 'selected' : ''}>${esc(k.name)}</option>`).join('')}</select>
        <div class="qa-main"><div class="qa-title">${esc(it.title)}</div><div class="qa-meta">${meta.map(x => `<span>${esc(x)}</span>`).join('')}</div></div></div>`; }).join('')
      : '';
    $('#qa_save').textContent = items.length > 1 ? `${items.length}개 추가` : '추가';
  };
  openSheet(`
    <div class="sh-h"><button class="btn" data-act="close">닫기</button><b>빠르게 추가</b><button class="btn pri" data-act="save" id="qa_save">추가</button></div>
    <textarea id="qa_in" class="qa-in" placeholder="말하듯이 적어 보세요 (한 줄에 하나씩)"></textarea>
    <div id="qa_list"></div>
    <div class="qa-ex">예) 내일 3시 치과 · 금요일까지 레포트 · 11월 24일 시험 · 30분 전 알림 · #학교생활<br>반복) 매주 월~금 8시 학원 11월만 · 매일 영어 · 매월 25일 월세<br>"매일·매주·마다·매월" 없이 쓴 요일(주말 대청소 등)은 이번 주에만 들어가요.<br>날짜가 없으면 선택한 날(${esc(dateLabel(S.sel))})에 들어가고, 카테고리는 알아서 골라요.</div>`,
  (b, e) => {
    if (!b){
      if (e && e.target.id === 'qa_in') preview();
      return;
    }
    if (b.dataset.act === 'close') return closeSheet();
    if (b.dataset.act === 'save'){
      preview();
      if (!items.length) return toast('할일을 적어 주세요');
      let nr = 0;
      items.forEach(it => {
        if (it.repeat){
          nr++;
          const r = { id: uid(), title: it.title, categoryId: it.categoryId, repeat: it.repeat, days: it.days || [], monthDay: it.monthDay, every: it.every,
            start: it.start, end: it.end || '', time: it.time, endTime: it.endTime, alarm: it.alarm, autoAdd: false, createdAt: Date.now() };
          S.routines[r.id] = r;
          enqueue(r.id, async () => { const created = await api('saveRoutine', r); (created || []).forEach(t => { S.tasks[t.id] = t; }); render(); });
        } else saveTask(newTask({ title: it.title, categoryId: it.categoryId, date: it.date, time: it.time, endTime: it.endTime, due: it.due, alarm: it.alarm }));
      });
      render(); closeSheet();
      if (nr){ toast(nr === items.length ? `반복 일정 ${nr}개를 만들었어요 — 해당 날짜에 흐리게 보이면 눌러서 추가` : `할일 ${items.length - nr}개, 반복 일정 ${nr}개를 만들었어요`); return; }
      const dates = [...new Set(items.map(i => i.date))];
      toast(items.length === 1 ? `${dateLabel(items[0].date)}에 추가했어요` : `${items.length}개 추가했어요`);
      if (dates.length === 1 && dates[0] !== S.sel) goto(dates[0]);
    }
  });
  $('#sheet').onchange = e => { const i = e.target.dataset.qi; if (i === undefined) return; items[i].categoryId = e.target.value; items[i].userCat = true; e.target.style.setProperty('--c', ink(S.cats[e.target.value].color)); };
  setTimeout(() => $('#qa_in') && $('#qa_in').focus(), 60);
}
$('#fab').addEventListener('click', openQuickAdd);

/* ───────── 연결 화면 ───────── */
function showConnect(){
  $('#app').classList.add('hidden'); $('#fab').classList.add('hidden');
  $('#connect').classList.remove('hidden');
}
$('#cn_go').addEventListener('click', async () => {
  const btn = $('#cn_go'), msg = $('#cn_msg');
  let url = $('#cn_url').value.trim(), token = $('#cn_token').value.trim();
  if (url && !/^https?:/i.test(url)){
    try { const o = JSON.parse(atob(url)); url = o.u; token = o.t; } catch (e) { msg.textContent = '기기 연결 코드가 올바르지 않아요'; return; }
  }
  if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(url)){ msg.textContent = '서버 주소는 https://script.google.com/…/exec 형태예요'; return; }
  if (!token){ msg.textContent = '연결 코드를 입력해 주세요'; return; }
  btn.disabled = true; btn.textContent = '연결 중…'; msg.textContent = '';
  try {
    const conn = { url, token }, r = rangeFor(S.ym);
    const d = await callServer(conn, 'load', [r.from, r.to]);
    CONN = conn; store.set(CONN_KEY, JSON.stringify(conn));
    if (IS_APP) try { window.TodoAndroid.setConnection(url, token); } catch (e) {}
    $('#connect').classList.add('hidden'); $('#app').classList.remove('hidden'); $('#fab').classList.remove('hidden');
    applyLoad(d); toast('연결됐어요!');
  } catch (e) {
    msg.textContent = e.message;
  } finally { btn.disabled = false; btn.textContent = '연결하기'; }
});

/* 위젯에서 체크한 할일을 받아와 앱에서 저장 (서버 동기화 보장) */
function takeWidgetDone(){
  if (!IS_APP || !window.TodoAndroid.takePendingDone) return;
  let ids = [];
  try { ids = JSON.parse(window.TodoAndroid.takePendingDone() || '[]'); } catch (e) {}
  ids.forEach(item => {
    const id = item.id || item, at = item.at || Date.now(), t = S.tasks[id];
    if (t){ if (!t.done) saveTask({ ...t, done: true, doneAt: at }); }
    else enqueue(id, () => api('complete', id));
  });
}
function onAppResume(){ takeWidgetDone(); refresh(); }

/* ───────── 시작 ───────── */
function start(){
  if (!CONN){ showConnect(); return; }
  try {
    const c = JSON.parse(store.get(CACHE_KEY) || 'null');
    if (c){ S.cats = byId(c.cats); S.routines = byId(c.routines); S.tasks = byId(c.tasks); if (c.prefs) S.prefs = c.prefs; }
  } catch (e) {}
  render(); takeWidgetDone(); refresh();
  if (IS_APP) try { window.TodoAndroid.setConnection(CONN.url, CONN.token); } catch (e) {}
}
applyTheme();
setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 20000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const t = localToday();
  if (t !== S.today){ if (S.sel === S.today) S.sel = t; S.today = t; S.ym = S.sel.slice(0, 7); render(); }
  takeWidgetDone(); refresh();
});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
start();
</script>
